name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      # PageProps·LayoutProps 같은 라우트 타입은 next dev/build가 만들기 때문에 CI에서는 먼저 생성한다.
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm test
