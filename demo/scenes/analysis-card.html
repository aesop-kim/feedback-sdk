<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>분석 중 카드</title>
<link rel="stylesheet" href="scene-base.css" />
<style>
  body {
    display: grid;
    place-items: center;
    text-align: center;
  }
  .headline {
    font-size: 56px;
    line-height: 1.4;
    font-weight: 700;
    letter-spacing: -0.025em;
  }
  .steps {
    margin-top: 28px;
    display: inline-flex;
    align-items: center;
    gap: 18px;
    font-size: 26px;
    font-weight: 500;
    color: var(--grey-600);
  }
  .steps i {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--grey-400);
  }
</style>
</head>
<body>
  <div>
    <h1 class="headline">말한 내용을 문제별로 정리해요</h1>
    <p class="steps"><span>받아쓰기</span><i></i><span>장면 찾기</span><i></i><span>가리킨 요소 찾기</span></p>
  </div>
</body>
</html>
